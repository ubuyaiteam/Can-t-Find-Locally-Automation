<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>{% block title %}Opportunity Research{% endblock %} · Ubuy</title>
<style>
:root{--ink:#17252a;--mute:#5b6b70;--line:#d9e2e4;--bg:#f4f7f7;--card:#fff;--accent:#0f6b6b;--accent-ink:#fff;--warn:#a8650a;--warn-bg:#fdf1de;--bad:#a3261f;--bad-bg:#fbe7e5;--good:#1d6b3a;--good-bg:#e2f3e8;--info-bg:#e6f0f1}
*{box-sizing:border-box}body{margin:0;font:15px/1.5 "Segoe UI",system-ui,-apple-system,Roboto,sans-serif;color:var(--ink);background:var(--bg)}
header{background:var(--ink);color:#fff;padding:14px 28px;display:flex;align-items:baseline;gap:18px}header h1{font-size:18px;margin:0;font-weight:600}header a{color:#b9d3d6;text-decoration:none;font-size:14px}
main{max-width:1240px;margin:22px auto;padding:0 20px}
.card{background:var(--card);border:1px solid var(--line);border-radius:6px;padding:18px 20px;margin-bottom:18px}
h2{font-size:17px;margin:0 0 12px}h3{font-size:14px;margin:14px 0 6px}
label{display:block;font-weight:600;font-size:13px;margin-bottom:4px}
select,input[type=text],input[type=number]{width:100%;padding:9px 10px;border:1px solid #b8c7ca;border-radius:4px;font:inherit;background:#fff}
button,.btn{background:var(--accent);color:var(--accent-ink);border:0;border-radius:4px;padding:10px 18px;font:inherit;font-weight:600;cursor:pointer;text-decoration:none;display:inline-block}
button.secondary,.btn.secondary{background:#fff;color:var(--accent);border:1px solid var(--accent)}button:disabled{opacity:.5;cursor:default}
button:focus-visible,a:focus-visible,select:focus-visible,input:focus-visible,summary:focus-visible{outline:3px solid #f2b84b;outline-offset:2px}
.grid{display:grid;gap:14px}.g4{grid-template-columns:2fr 1fr 1.4fr 1fr}.g6{grid-template-columns:repeat(6,1fr)}
@media(max-width:900px){.g4,.g6{grid-template-columns:1fr 1fr}}
.pill{display:inline-block;padding:2px 9px;border-radius:11px;font-size:12px;font-weight:600;background:var(--info-bg);color:var(--accent)}
.pill.good{background:var(--good-bg);color:var(--good)}.pill.warn{background:var(--warn-bg);color:var(--warn)}.pill.bad{background:var(--bad-bg);color:var(--bad)}
.stat{border-left:3px solid var(--accent);padding-left:10px}.stat b{font-size:24px;display:block;line-height:1.1}.stat span{font-size:12px;color:var(--mute)}
table{width:100%;border-collapse:collapse}th,td{text-align:left;padding:8px 10px;border-bottom:1px solid var(--line);vertical-align:top;font-size:14px}th{font-size:12px;color:var(--mute);font-weight:600}
.bar{height:10px;background:#dbe6e7;border-radius:5px;overflow:hidden}.bar i{display:block;height:100%;background:var(--accent);transition:width .4s}
.note{background:var(--info-bg);border-radius:4px;padding:10px 12px;font-size:13px;color:#274;margin:10px 0}.note.warn{background:var(--warn-bg);color:#5c3a07}
.muted{color:var(--mute);font-size:13px}pre.log{background:#101c1f;color:#cfe3e5;padding:12px;border-radius:4px;max-height:240px;overflow:auto;font:12px/1.5 Consolas,monospace;margin:0;white-space:pre-wrap}
.tabs{display:flex;gap:6px;margin-bottom:12px;flex-wrap:wrap}.tabs button{background:#fff;color:var(--ink);border:1px solid var(--line)}.tabs button[aria-selected=true]{background:var(--ink);color:#fff}
details.prod{border:1px solid var(--line);border-radius:5px;margin-bottom:8px;background:#fff}details.prod>summary{cursor:pointer;padding:10px 14px;display:grid;grid-template-columns:44px 2.2fr 1.1fr 1fr 1.2fr 1.2fr 1.3fr;gap:10px;align-items:center;list-style:none}
details.prod>summary::-webkit-details-marker{display:none}details.prod[open]>summary{border-bottom:1px solid var(--line);background:#f7fafa}
.detail{padding:12px 16px;display:grid;grid-template-columns:1fr 1fr;gap:4px 28px}@media(max-width:900px){.detail,details.prod>summary{grid-template-columns:1fr}}
.chip{display:inline-block;border:1px solid var(--line);border-radius:4px;padding:1px 7px;margin:2px 3px 2px 0;font-size:12px;background:#f7fafa}
.chip.good{border-color:#9fd1b0;background:var(--good-bg)}.chip.warn{border-color:#efcf98;background:var(--warn-bg)}
code.kw{display:inline-block;background:#eef3f4;border-radius:3px;padding:1px 6px;margin:2px;font-size:12px}
.detail h3{border-bottom:1px solid var(--line);padding-bottom:3px}.detail ul{margin:4px 0;padding-left:18px}.detail a{color:var(--accent);word-break:break-all}
</style></head><body>
<header><h1>Ubuy Product Opportunity Research</h1><a href="{{ url_for('opportunity.index') }}">New research &amp; history</a><a href="{{ url_for('opportunity.health_page') }}">Source health</a></header>
<main>{% block body %}{% endblock %}</main></body></html>
